name: analytics-service CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SERVICE_NAME: analytics-service
  PYTHON_VERSION: '3.11'

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # "build" for a Python service = confirm every module actually imports cleanly
      - name: Build (syntax / import check)
        run: python -m compileall -q .

      - name: Run unit tests
        run: |
          if ls test_*.py > /dev/null 2>&1 || ls tests/test_*.py > /dev/null 2>&1; then
            pip install pytest
            pytest -v
          else
            echo "No test files found, skipping (add tests later)"
          fi

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=120

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # SCA: scans requirements.txt for known-vulnerable dependency versions
      - name: SCA - Trivy filesystem scan (dependency vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          format: table

      # SAST: scans our own source code for insecure patterns (-lll = only report HIGH severity)
      - name: SAST - bandit (source code vulnerabilities)
        run: |
          pip install bandit
          bandit -r . -lll

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, lint, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }} .

      - name: Container scan - Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          exit-code: 1
          format: table

      # --- AWS / ECR push disabled: no AWS account access right now (switching accounts) ---
